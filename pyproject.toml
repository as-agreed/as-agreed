[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "as-agreed"
version = "0.0.3"
description = "Checks each step of a pipeline against what was agreed, and stops the last step if a declared field changed."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "BizBuilder, Inc." }]
keywords = ["ai-agents", "multi-agent-systems", "agent-reliability", "provenance", "handoff", "llm", "local-first"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
langgraph = ["langgraph>=1.2"]
temporal = ["temporalio>=1.35"]

[project.scripts]
as-agreed = "as_agreed.__main__:main"

[project.urls]
Homepage = "https://github.com/as-agreed/as-agreed"
Issues = "https://github.com/as-agreed/as-agreed/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
as_agreed = ["examples/*/*.md", "examples/*/*.json"]
